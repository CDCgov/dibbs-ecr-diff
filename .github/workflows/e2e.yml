name: Run end-to-end tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: "Set up Python"
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version-file: "pyproject.toml"
          enable-cache: true

      - name: Install the project
        run: uv sync --all-packages --locked --all-extras --dev

      - name: Run e2e tests
        shell: bash
        run: |
          uv run pytest -vv -s e2e/
