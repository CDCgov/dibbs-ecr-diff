# Security Scan
#
# Builds the lambda image, scans it for vulnerabilities with Trivy, and uploads
# the results to the Security tab. If triggered by a pull request, also posts a
# comment on the PR summarizing the results.

name: Security Scan

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
  merge_group:
    types:
      - checks_requested
  push:
    branches: [main]
  schedule:
    # Run on main once daily at 2 PM UTC
    - cron: "0 14 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_SEVERITY: "CRITICAL,HIGH,MEDIUM,LOW"

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    strategy:
      matrix:
        image:
          - name: "did-lambda"
            dockerfile: "docker/lambda.Dockerfile"
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build image locally (no push)
        uses: docker/build-push-action@v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: ${{ !env.ACT }}
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          load: true # Load locally for scanning only
          tags: local-scan/${{ matrix.image.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy runs from its container image rather than aquasecurity/trivy-action:
      # the lockfile check can't read aquasecurity repos from Actions
      # (github/gh-actions-lock#274). The runner mounts the workspace and the
      # Docker socket, so Trivy sees the image loaded above. Bump the tag and
      # digest together (`docker buildx imagetools inspect aquasec/trivy:<tag>`).
      #
      # The SARIF report covers every severity, as trivy-action did by default;
      # TRIVY_SEVERITY applies to the JSON report used for the PR comment. The
      # runner passes workflow env into the container and Trivy reads
      # TRIVY_SEVERITY, so the SARIF step overrides it with an explicit flag.
      - name: Run Trivy vulnerability scanner (SARIF)
        uses: docker://aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e
        with:
          args: >-
            image
            --format sarif
            --output trivy-${{ matrix.image.name }}-results.sarif
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
            --timeout 10m
            local-scan/${{ matrix.image.name }}:${{ github.sha }}

      - name: Run Trivy vulnerability scanner (JSON)
        uses: docker://aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e
        with:
          args: >-
            image
            --skip-db-update
            --format json
            --output trivy-${{ matrix.image.name }}-results.json
            --severity ${{ env.TRIVY_SEVERITY }}
            --timeout 10m
            local-scan/${{ matrix.image.name }}:${{ github.sha }}

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.39.3
        if: ${{ always() && !env.ACT }}
        with:
          sarif_file: "trivy-${{ matrix.image.name }}-results.sarif"
          category: "security-scan-${{ matrix.image.name }}"

      - name: Upload JSON results as artifact
        uses: actions/upload-artifact@v7.0.2
        if: ${{ always() && !env.ACT }}
        with:
          name: trivy-results-${{ matrix.image.name }}
          path: trivy-${{ matrix.image.name }}-results.json
          retention-days: 5

      - name: Generate scan summary
        if: always()
        run: |
          echo "## Security Scan Results for ${{ matrix.image.name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "trivy-${{ matrix.image.name }}-results.sarif" ]; then
            echo "Vulnerability scan completed successfully" >> $GITHUB_STEP_SUMMARY
            echo "Results uploaded to Security tab" >> $GITHUB_STEP_SUMMARY
            echo "Category: security-scan-${{ matrix.image.name }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "Scan failed or no results generated" >> $GITHUB_STEP_SUMMARY
          fi

  # Posts/updates a PR comment summarizing findings.
  pr-comment:
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: ${{ always() && github.event_name == 'pull_request' }}

    env:
      SCAN_IMAGES_CSV: "did-lambda"

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Download scan results
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: trivy-results-*
          merge-multiple: true

      - name: PR Security Summary with Details
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const script = require('./.github/scripts/security-summary.js');

            // parse `SCAN_IMAGES_CSV` to array
            // ex: 'did-lambda,did-api' -> ['did-lambda', 'did-api']
            const images = (process.env.SCAN_IMAGES_CSV ?? '')
              .split(',')
              .map((x) => x.trim())
              .filter(Boolean);

            const isLocalActRun = process.env.ACT === "true";

            // generate PR summary and add PR comment
            await script.generatePRSummary(github, context, core, images, isLocalActRun);