<!--
This is a single-file web app to let devs upload eICRs/RRs to our local environment S3 buckets.
This should be run using Docker & our compose.yml file
to allow the uploader to send requests to our local S3 without dealing with CORS-related restrictions
-->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Difference in Docs (Dev Uploader)</title>
  <style>
    body { font: 16px sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
    fieldset { margin: 1rem 0; padding: 1rem; }
    label { display: block; margin: .75rem 0; }
    input, select { box-sizing: border-box; display: block; margin-top: .25rem; width: 100%; }
    button { margin: .25rem .5rem .25rem 0; }
    .status { white-space: pre-wrap; }
    .error { color: red; }
  </style>
</head>
<body>
  <main>
    <h1>Difference in Docs - Dev Input Uploader</h1>
    <p>Upload eICRs and RRs to local S3.</p>
    <div class="preact-app"></div>
  </main>

  <script type="module">
    import { html, render, useRef, useState } from 'https://esm.sh/htm@3/preact/standalone';
    import { PutObjectCommand, S3Client } from 'https://esm.sh/@aws-sdk/client-s3@3.1087.0?bundle';

    const S3_BUCKET = 'ecr-dev-data-repository';
    const DID_INPUT_PREFIX = 'DIDInput/';
    const REFINER_INPUT_PREFIX = 'RefinerOutputV2/';

    const UPLOAD_TYPES = { REFINED: 'refined', UNREFINED: 'unrefined', REMAINDER_RR: 'remainder_rr' };
    const FAILURE_MODES = { NONE: 'none', INFRA_ERROR: 'infra_error', APP_ERROR: 'app_error' };

    const AWS_ENDPOINT_URL = 'http://localhost:4566';
    const AWS_ACCESS_KEY_ID = 'test'
    const AWS_SECRET_ACCESS_KEY = 'test';
    const AWS_DEFAULT_REGION = 'us-east-1';

    const s3 = new S3Client({
      region: AWS_DEFAULT_REGION,
      endpoint: AWS_ENDPOINT_URL,
      forcePathStyle: true,
      credentials: {
        accessKeyId: AWS_ACCESS_KEY_ID,
        secretAccessKey: AWS_SECRET_ACCESS_KEY
      }
    });

    function Form() {
      const nextRowId = useRef(1);
      const [rows, setRows] = useState([0]);
      const [uploading, setUploading] = useState(false);
      const [status, setStatus] = useState({ error: false, message: '' });

      function addRow() {
        const id = nextRowId.current++;
        setRows((prev) => [...prev, id]);
      }

      function removeRow(id) {
        setRows((prev) => prev.filter((rowId) => rowId !== id));
      }

      async function handleSubmit(ev) {
        setUploading(true);
        setStatus({ error: false, message: '' });

        const { error } = await submitForm(ev);
        setUploading(false);

        if (error) {
          console.error(error);
          setStatus({ error: true, message: error.message });
          return
        }

        setStatus({ error: false, message: 'Upload complete.' });
        setRows(() => [nextRowId.current++]); // empty rows, and add new one
      }

      const fieldsets = rows.map((id) =>
        html`<${FieldSet}
          key=${id}
          disabled=${uploading}
          onRemove=${() => removeRow(id)}
        />`
      );

      return html`
        <form onsubmit=${handleSubmit}>
          <div class="rows">
            ${fieldsets}
          </div>

          <label>
            Failure mode
            <select name="failure-mode" disabled=${uploading}>
              <option value=${FAILURE_MODES.NONE}>None</option>
              <option value=${FAILURE_MODES.INFRA_ERROR}>InfraError</option>
              <option value=${FAILURE_MODES.APP_ERROR}>ApplicationError</option>
            </select>
          </label>

          <button
            disabled=${uploading}
            onclick=${addRow}
            type="button"
          >
            Add eICR
          </button>

          <button disabled=${uploading} type="submit">
            Upload
          </button>

          <p class=${status.error ? 'status error' : 'status'} role="status">
            ${status.message}
          </p>
        </form>
      `;
    }

    function FieldSet({ disabled, onRemove }) {
      const [type, setType] = useState(UPLOAD_TYPES.REFINED);

      return html`
        <fieldset class="upload-row" disabled=${disabled}>
          <legend></legend>
          <label>
            eICR XML
            <input name="eicr-file" type="file" accept=".xml,application/xml,text/xml" required/>
          </label>
          <label>
            RR XML
            <input name="rr-file" type="file" accept=".xml,application/xml,text/xml" required />
          </label>
          <label>
            Upload Type
            <select name="upload-type" value=${type} onChange=${e => setType(e.currentTarget.value)}>
              <option value=${UPLOAD_TYPES.REFINED}>Refined</option>
              <option value=${UPLOAD_TYPES.UNREFINED}>Unrefined (Original eICR/RR Pair)</option>
              <option value=${UPLOAD_TYPES.REMAINDER_RR}>Remainder RR</option>
            </select>
          </label>

          <label>
            Jurisdiction ID
            <input name="jurisdiction" type="text" placeholder="SDDH" value="SDDH" />
          </label>

          ${(type === 'refined') && html`
            <label>
              Condition
              <input name="condition" type="text" placeholder="COVID19" value="COVID19" />
            </label>
          `}

          <button onclick=${onRemove} type="button">Remove</button>
        </fieldset>
      `;
    }

    render(
      html`<${Form} />`,
      document.querySelector('.preact-app')
    );

    function normalizeS3Key(path = '') {
      if (!path || !path.trim()) return '';

      return path.replace(/\/+/g, '/') // replace duplicate slashes
        .replace(/^\/+/, '')    // remove all leading slashes
        .replace(/\/+$/, '');   // remove all trailing slashes
    }

    function normalizeKeyPart(part = '') {
      // remove non-alphanumerics
      return (part || '').replace(/[^a-zA-Z0-9]/g, '');
    }

    function parseXML(text, filename) {
      // TODO: this loads the entire document into memory
      // native DOMParser doesn't support a streaming interface
      // so look for an alternative that allows us to parse out the setId and version number from the doc
      // some npm packages we can use here: `sax`, `saxes`
      // prefer one that lets you use async iterables
      const parser = new DOMParser();
      const doc = parser.parseFromString(text, 'application/xml');

      // https://developer.mozilla.org/en-US/docs/Web/API/DOMParser/parseFromString#error_handling
      const errorNode = doc.querySelector('parsererror');
      if (errorNode) throw Error(`${filename} is not valid XML`);

      return doc;
    }

    function getEICRMetadata(xmlDoc, filename) {
      const children = [...xmlDoc.documentElement.children];

      const setId = children
        .find((element) => element.localName === 'setId')
        ?.getAttribute('root')?.trim();

      const versionValue = children
        .find((element) => element.localName === 'versionNumber')
        ?.getAttribute('value')?.trim();

      const versionNumber = Number(versionValue);

      if (!setId || isNaN(versionNumber))
        throw Error(`${filename} has invalid setId or versionNumber`)

      return { setId, versionNumber };
    }

    async function buildUpload(row, persistenceId) {
      const eicr = row.elements.namedItem('eicr-file').files[0];
      const rr = row.elements.namedItem('rr-file').files[0];
      const uploadType = row.elements.namedItem('upload-type').value;
      const jurisdiction = normalizeKeyPart(row.elements.namedItem('jurisdiction')?.value ?? '');
      const condition = normalizeKeyPart(row.elements.namedItem('condition')?.value ?? '');

      if (!eicr) throw new Error('Each upload needs an eICR XML file.');
      if (!rr) throw new Error('Each upload needs an RR XML file.');

      let eicrKey;
      let rrKey;

      if (uploadType === UPLOAD_TYPES.REFINED) {
        eicrKey = `RefinerOutputV2/${persistenceId}/${jurisdiction}/${condition}/${eicr.name}`;
        rrKey = `RefinerOutputV2/${persistenceId}/${jurisdiction}/${condition}/${rr.name}`;
      } else if (uploadType === UPLOAD_TYPES.UNREFINED) {
        eicrKey = `eCRMessageV2/${persistenceId}`;
        rrKey = `RRMessageV2/${persistenceId}`;
      } else if (uploadType === UPLOAD_TYPES.REMAINDER_RR) {
        eicrKey = `eCRMessageV2/${persistenceId}`;
        rrKey = `RefinerOutputV2/${persistenceId}/${jurisdiction}/unrefined_rr/refined_rr.xml`;
      }

      // parse both docs. parse RR for XML validation
      const eicrDoc = parseXML(await eicr.text(), eicr.name);
      const rrDoc = parseXML(await rr.text(), rr.name);
      const metadata = getEICRMetadata(eicrDoc, eicr.name);

      // normalize keys
      eicrKey = normalizeS3Key(eicrKey);
      rrKey = normalizeS3Key(rrKey);

      const manifestRecord = {
        eicr: eicrKey,
        rr: rrKey,
        originalRr: null, // TODO
        jurisdictions: [jurisdiction],
        ...metadata
      };

      const objects = [{ key: eicrKey, file: eicr }, { key: rrKey, file: rr }];
      return { manifestRecord, objects };
    }

    async function submitForm(ev) {
      ev.preventDefault();
      const form = ev.currentTarget;
      const failureMode = form.elements.namedItem('failure-mode').value;

      try {
        const datePath = new Date().toISOString().slice(0, 10).replaceAll('-', '/'); // ex: 2026/07/22
        const persistenceId = `${datePath}/${crypto.randomUUID()}`;
        const uploads = [];

        for (const el of form.elements) {
          if (el instanceof HTMLFieldSetElement) {
            const upload = await buildUpload(el, persistenceId);
            uploads.push(upload);
          }
        }

        // upload all individual eICRs and RRs first
        const xmls = uploads.flatMap((upload) => upload.objects);
        for (const xml of xmls) {
          await s3.send(
            new PutObjectCommand({
              Bucket: S3_BUCKET,
              Key: xml.key,
              Body: new Uint8Array(await xml.file.arrayBuffer()), // convert file contents into byte array
              ContentType: 'application/xml'
            })
          );
        }

        // finally, upload manifest file
        const manifestKey = `${DID_INPUT_PREFIX}${persistenceId}`;

        const manifest = {
          Files: uploads.map((upload) => upload.manifestRecord),
        };

        // simulate failure modes
        if (failureMode === FAILURE_MODES.INFRA_ERROR) {
          // lambda attempts to read an object that doesn't exist
          manifest.Files[0].eicr = `UndefinedOutputV2/${persistenceId}/missing/eicr.xml`
        } else if (failureMode === FAILURE_MODES.APP_ERROR) {
          // lambda validation rejects the input manifest shape
          manifest.Files[0].versionNumber = 'not-an-integer';
        }

        await s3.send(new PutObjectCommand({
          Bucket: S3_BUCKET,
          Key: manifestKey,
          Body: JSON.stringify(manifest, null, 2),
          ContentType: 'application/json',
        }));

        return { ok: true };
      } catch (e) {
        return { ok: false, error: e };
      }
    }
  </script>
</body>
</html>
