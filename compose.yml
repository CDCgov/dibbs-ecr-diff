services:
  lambda:
    build:
      context: .
      dockerfile: ./docker/lambda.Dockerfile
    ports:
      - "9000:8080"
    environment:
      - VERSION=local
    depends_on:
      - localstack
    restart: unless-stopped
    develop:
      watch:
        # rebuild image when there are changes to core or lambda packages
        - action: rebuild
          path: ./packages/core
          ignore:
            - test
        - action: rebuild
          path: ./packages/lambda
          ignore:
            - test
        # rebuild the image if dependencies change by checking uv.lock
        - action: rebuild
          path: ./uv.lock

  localstack:
    image: docker.io/localstack/localstack:community-archive
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,dynamodb,sqs
      - PERSISTENCE=1
    volumes:
      - localstack-data:/var/lib/localstack
      - ./docker/s3-init.sh:/etc/localstack/init/ready.d/10-s3-init.sh
      - ./docker/dynamodb-init.sh:/etc/localstack/init/ready.d/20-dynamodb-init.sh

volumes:
  localstack-data:
